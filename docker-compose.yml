services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: getshortlisted-backend
    ports:
      - "8005:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_data
      - ./backend/app:/app/app
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: getshortlisted-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: getshortlisted-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: getshortlisted
      POSTGRES_PASSWORD: getshortlisted_dev
      POSTGRES_DB: getshortlisted
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U getshortlisted" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  chroma_data:
